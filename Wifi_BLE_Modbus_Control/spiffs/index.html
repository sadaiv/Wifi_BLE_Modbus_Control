<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESP32 Demo</title>
<style>
:root { --maxw: 720px; }
* { box-sizing: border-box; }
html, body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", sans-serif; }
body { display: grid; min-height: 100vh; background: #f6f7fb; }
header { position: sticky; top: 0; backdrop-filter: blur(6px); background: rgba(255,255,255,.7); border-bottom: 1px solid #eaeaea; }
.bar { max-width: var(--maxw); margin: 0 auto; padding: .9rem 1rem; display:flex; align-items:center; gap:.75rem; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#3b82f6,#06b6d4); }
h1 { font-size: 1.1rem; margin: 0; font-weight: 650; }


main { max-width: var(--maxw); width: 100%; margin: 1rem auto 2rem; padding: 0 1rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(12, 1fr); }
.card { grid-column: 1 / -1; background: #fff; border: 1px solid #eaeaea; border-radius: 16px; padding: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.row { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; }
.grow { flex: 1 1 auto; }
.muted { color:#666; font-size:.92rem; }


button { border: 0; border-radius: 999px; padding: .6rem 1rem; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.solid { background:#111827; color:#fff; }
.ghost { background:#f3f4f6; }
.pill { background:#eef2ff; color:#3730a3; padding:.25rem .6rem; border-radius:999px; font-size:.8rem; font-weight:700; }


@media (min-width: 620px) {
.card.half { grid-column: span 6; }
}
</style>
</head>
<body>
<header>
<div class="bar">
<div class="logo" aria-hidden="true"></div>
<h1>ESP32 Demo</h1>
<span id="chip" class="pill" title="Chip model"></span>
</div>
</header>


<main>
<section class="grid">
<article class="card half">
<h3>Device Info</h3>
<p class="muted" id="info">Loading…</p>
<div class="row">
<button class="ghost" onclick="refreshInfo()">Refresh</button>
</div>
</article>


<article class="card half">
<h3>GPIO Control</h3>
<p class="muted">Toggle the built‑in LED (GPIO 2 on many boards).</p>
<div class="row">
<div class="grow"></div>
<button class="solid" onclick="setLed(1)">ON</button>
<button class="ghost" onclick="setLed(0)">OFF</button>
</div>
<p id="ledStatus" class="muted" style="margin-top:.5rem">LED: unknown</p>
</article>
</section>
</main>


<script>
async function refreshInfo(){
try{
const r = await fetch('/api/info');
const j = await r.json();
document.querySelector('#chip').textContent = j.model || 'ESP32';
document.querySelector('#info').textContent = `Heap: ${j.heap_free} bytes • SDK: ${j.idf}`;
}catch(e){ document.querySelector('#info').textContent = 'Failed to load'; }
}
async function setLed(state){
try{
const r = await fetch(`/api/gpio?pin=2&state=${state}`);
const j = await r.json();
document.querySelector('#ledStatus').textContent = `LED: ${j.state ? 'ON' : 'OFF'}`;
}catch(e){ document.querySelector('#ledStatus').textContent = 'LED: error'; }
}
refreshInfo();
</script>
</html>
